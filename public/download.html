<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download · Secure File Sharing</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="nav">
      <a href="/upload">Upload</a>
      <a href="/download" class="active">Download</a>
    </nav>
    <div class="wrap">
      <h1>Download file</h1>
      <p class="sub">All uploaded files are listed below. Select one, enter your password, and decrypt.</p>
      <div class="card">
        <p id="empty-msg" class="sub" hidden>No files yet. <a href="/upload">Upload one</a>.</p>
        <ul id="file-list"></ul>
        <div id="decrypt-panel" hidden>
          <p id="selected-name"></p>
          <label for="passphrase">Decryption password</label>
          <input id="passphrase" type="password" autocomplete="current-password" />
          <button type="button" id="download-btn" class="btn secondary">Decrypt &amp; Download</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>
    <script type="module" src="/js/download.js"></script>
  </body>
</html>
